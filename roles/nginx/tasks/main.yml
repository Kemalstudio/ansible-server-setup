---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Apply security settings (hide version, security headers)
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Make sure Nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  # On a fresh server the package is only simulated in --check mode
  ignore_errors: "{{ ansible_check_mode }}"
