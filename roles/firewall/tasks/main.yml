---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

# In --check mode on a fresh server UFW is only simulated, so the ufw binary doesn't exist yet
- name: Check that UFW is installed
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: firewall_ufw_bin

- name: Configure UFW
  when: firewall_ufw_bin.stat.exists
  block:
    # SSH goes first, so we are never locked out. "limit" also allows the port,
    # so SSH is not repeated below (allow + limit on one port would overwrite each other on every run)
    - name: Allow SSH with rate limiting
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Allow other required TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ firewall_allowed_tcp_ports | map('string') | reject('equalto', ssh_port | string) | list }}"

    # ---------- NAT gateway (only when firewall_allow_routing is true) ----------
    - name: Enable IP forwarding for UFW
      ansible.builtin.lineinfile:
        path: /etc/ufw/sysctl.conf
        regexp: '^#?\s*net/ipv4/ip_forward\s*='
        line: net/ipv4/ip_forward=1
      when: firewall_allow_routing | bool
      notify: Reload ufw

    - name: Add NAT (masquerade) rules to UFW
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        insertbefore: BOF
        marker: "# {mark} ANSIBLE MANAGED NAT"
        block: |
          *nat
          :POSTROUTING ACCEPT [0:0]
          -A POSTROUTING -s {{ firewall_nat_source }} -o {{ firewall_nat_out_interface }} -j MASQUERADE
          COMMIT
      when: firewall_allow_routing | bool
      notify: Reload ufw

    - name: Allow routed (forwarded) traffic on NAT gateways
      community.general.ufw:
        direction: routed
        default: allow
      when: firewall_allow_routing | bool

    - name: Deny all other incoming traffic and enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
