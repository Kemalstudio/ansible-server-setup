---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure fail2ban jail for SSH
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Make sure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  # On a fresh server the package is only simulated in --check mode
  ignore_errors: "{{ ansible_check_mode }}"
