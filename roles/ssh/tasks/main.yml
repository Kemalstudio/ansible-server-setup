---
# Safety check: never disable password login unless the admin key is really in place
- name: Check that the admin user has an authorized SSH key
  ansible.builtin.stat:
    path: "/home/{{ admin_user }}/.ssh/authorized_keys"
  register: ssh_admin_keys

- name: Stop if the admin key is missing (prevents locking yourself out)
  ansible.builtin.assert:
    that: ssh_admin_keys.stat.exists and ssh_admin_keys.stat.size > 0
    fail_msg: "No authorized_keys for {{ admin_user }}. Refusing to harden SSH."
  # In --check mode the admin user and key are only simulated, so the file can't exist yet
  when: not ansible_check_mode

# sshd uses the FIRST value it finds and reads sshd_config.d/*.conf in alphabetical order.
# Ubuntu ships 50-cloud-init.conf with "PasswordAuthentication yes", so our file must sort first.
- name: Apply hardened SSH configuration
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Remove old hardening file from earlier versions of this playbook
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    state: absent
  notify: Restart ssh

- name: Apply SSH changes now, before checking them
  ansible.builtin.meta: flush_handlers

# Self-test: read the configuration sshd is ACTUALLY using, not just our file
- name: Read effective SSH configuration
  ansible.builtin.command: sshd -T
  register: ssh_effective_config
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Verify that hardening is really in effect
  ansible.builtin.assert:
    that:
      - "'passwordauthentication ' + ssh_password_authentication in ssh_effective_config.stdout_lines"
      - "'permitrootlogin ' + ssh_permit_root_login in ssh_effective_config.stdout_lines"
      - "'kbdinteractiveauthentication no' in ssh_effective_config.stdout_lines"
    fail_msg: "sshd is not using the hardened settings — another file in /etc/ssh/sshd_config.d overrides them."
    success_msg: "SSH hardening verified with sshd -T"
  when: not ansible_check_mode
