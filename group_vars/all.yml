---
# ---------- General ----------
server_timezone: "Asia/Ashgabat"
base_packages:
  - curl
  - git
  - htop
  - vim
  - unzip
  - ca-certificates
  - gnupg

# ---------- Admin user ----------
admin_user: "devops"
# Public key that will be allowed to log in as admin_user
admin_ssh_public_key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

# ---------- SSH ----------
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 3

# ---------- Firewall ----------
firewall_allowed_tcp_ports:
  - "{{ ssh_port }}"
  - 80
  - 443

# ---------- fail2ban ----------
fail2ban_bantime: "1h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 5

# ---------- Optional components ----------
install_docker: true
install_nginx: true
